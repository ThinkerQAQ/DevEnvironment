name: Shared Development Images

on:
  pull_request:
    paths:
      - "images/**"
      - "versions/**"
      - "scripts/**"
      - ".github/workflows/images.yml"
  push:
    branches:
      - main
    paths:
      - "images/**"
      - "versions/**"
      - "scripts/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: thinkerqaq

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell and resolve tags
        shell: bash
        run: |
          bash -n images/base/entrypoint.sh
          bash -n scripts/image-tags.sh
          bash -n scripts/verify-base.sh
          bash -n scripts/verify-android.sh
          bash scripts/image-tags.sh

      - name: Load versions
        shell: bash
        run: cat versions/tools.env >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check base Dockerfile
        shell: bash
        run: |
          docker buildx build --check \
            --build-arg GO_VERSION="$GO_VERSION" \
            --build-arg NODE_VERSION="$NODE_VERSION" \
            --build-arg UV_VERSION="$UV_VERSION" \
            --build-arg GOPLS_VERSION="$GOPLS_VERSION" \
            --build-arg SERENA_VERSION="$SERENA_VERSION" \
            --build-arg CODEGRAPH_VERSION="$CODEGRAPH_VERSION" \
            -f images/base/Dockerfile images/base

      - name: Check Android Dockerfile
        shell: bash
        run: |
          docker buildx build --check \
            --build-arg BASE_IMAGE=debian:bookworm-slim \
            --build-arg GRADLE_VERSION="$GRADLE_VERSION" \
            --build-arg GRADLE_SHA256="$GRADLE_SHA256" \
            --build-arg ANDROID_CMDLINE_TOOLS_REVISION="$ANDROID_CMDLINE_TOOLS_REVISION" \
            --build-arg ANDROID_CMDLINE_TOOLS_SHA256="$ANDROID_CMDLINE_TOOLS_SHA256" \
            --build-arg ANDROID_PLATFORM="$ANDROID_PLATFORM" \
            --build-arg ANDROID_BUILD_TOOLS="$ANDROID_BUILD_TOOLS" \
            --build-arg ANDROID_NDK="$ANDROID_NDK" \
            -f images/android/Dockerfile images/android

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell || true
          docker system prune -af || true
          df -h

      - name: Load versions
        shell: bash
        run: cat versions/tools.env >> "$GITHUB_ENV"

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          while IFS='=' read -r key value; do
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < <(bash scripts/image-tags.sh)

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base
        id: base
        uses: docker/build-push-action@v6
        with:
          context: images/base
          file: images/base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dev-base:${{ steps.tags.outputs.BASE_TAG }}
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
            GOPLS_VERSION=${{ env.GOPLS_VERSION }}
            SERENA_VERSION=${{ env.SERENA_VERSION }}
            CODEGRAPH_VERSION=${{ env.CODEGRAPH_VERSION }}
          cache-from: type=gha,scope=dev-base
          cache-to: type=gha,scope=dev-base,mode=max
          provenance: true

      - name: Verify published base
        shell: bash
        run: |
          image="$REGISTRY/$IMAGE_OWNER/dev-base:${{ steps.tags.outputs.BASE_TAG }}"
          docker pull "$image"
          docker run --rm \
            --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "$image" /repo/scripts/verify-base.sh /repo/versions/tools.env

      - name: Build and push Android
        id: android
        uses: docker/build-push-action@v6
        with:
          context: images/android
          file: images/android/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dev-android:${{ steps.tags.outputs.ANDROID_TAG }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/dev-base@${{ steps.base.outputs.digest }}
            GRADLE_VERSION=${{ env.GRADLE_VERSION }}
            GRADLE_SHA256=${{ env.GRADLE_SHA256 }}
            ANDROID_CMDLINE_TOOLS_REVISION=${{ env.ANDROID_CMDLINE_TOOLS_REVISION }}
            ANDROID_CMDLINE_TOOLS_SHA256=${{ env.ANDROID_CMDLINE_TOOLS_SHA256 }}
            ANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }}
            ANDROID_BUILD_TOOLS=${{ env.ANDROID_BUILD_TOOLS }}
            ANDROID_NDK=${{ env.ANDROID_NDK }}
          cache-from: type=gha,scope=dev-android
          cache-to: type=gha,scope=dev-android,mode=max
          provenance: true

      - name: Verify published Android
        shell: bash
        run: |
          image="$REGISTRY/$IMAGE_OWNER/dev-android:${{ steps.tags.outputs.ANDROID_TAG }}"
          docker pull "$image"
          docker run --rm \
            --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "$image" /repo/scripts/verify-base.sh /repo/versions/tools.env
          docker run --rm \
            --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            "$image" /repo/scripts/verify-android.sh /repo/versions/tools.env

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Published development images"
            echo
            echo "Base: $REGISTRY/$IMAGE_OWNER/dev-base:${{ steps.tags.outputs.BASE_TAG }}"
            echo "Base digest: ${{ steps.base.outputs.digest }}"
            echo
            echo "Android: $REGISTRY/$IMAGE_OWNER/dev-android:${{ steps.tags.outputs.ANDROID_TAG }}"
            echo "Android digest: ${{ steps.android.outputs.digest }}"
            echo
            echo "Consumers should prefer digest pins."
          } >> "$GITHUB_STEP_SUMMARY"
